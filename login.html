<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Free</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: flex;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 1200px;
            width: 100%;
        }

        .form-section {
            flex: 1;
            padding: 60px 50px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            font-size: 28px;
            cursor: pointer;
            color: #333;
            background: none;
            border: none;
            line-height: 1;
        }

        h1 {
            font-size: 42px;
            color: #333;
            margin-bottom: 40px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 25px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid #4CAF50;
            border-radius: 50px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        input[type="email"]::placeholder,
        input[type="password"]::placeholder {
            color: #9ed9a1;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #45a049;
        }

        .login-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .login-btn {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
        }

        .forgot-password {
            color: #666;
            text-decoration: none;
            font-size: 15px;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 35px 0;
            color: #666;
            font-size: 16px;
            font-weight: 600;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #ddd;
        }

        .divider::before {
            margin-right: 20px;
        }

        .divider::after {
            margin-left: 20px;
        }

        .social-login {
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            padding: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 30px;
        }

        .social-icon {
            width: 40px;
            height: 40px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .social-icon:hover {
            transform: scale(1.1);
        }

        .signup-link {
            text-align: center;
            color: #666;
            font-size: 15px;
        }

        .signup-link a {
            color: #4CAF50;
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
        }

        .image-section {
            flex: 1;
            background: url('footer girl image.jpg');
            background-size: cover;
            background-position: center;
            min-height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f8f8;
        }

        .placeholder-text {
            color: #999;
            font-size: 18px;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 968px) {
            .container {
                flex-direction: column;
            }

            .image-section {
                min-height: 300px;
            }

            .form-section {
                padding: 40px 30px;
            }

            h1 {
                font-size: 32px;
            }
        }
        /* ===============================
   LARGE TABLET / SMALL LAPTOP
   =============================== */
@media (max-width: 1024px) {

    .container {
        max-width: 90%;
    }

    .form-section {
        padding: 40px 35px;
    }

    h1 {
        font-size: 36px;
    }

    .image-section {
        min-height: 450px;
    }
}


/* ===============================
   TABLET VIEW (768px)
   =============================== */
@media (max-width: 768px) {

    body {
        padding: 10px;
    }

    .container {
        flex-direction: column;
        border-radius: 16px;
    }

    .image-section {
        min-height: 300px;
        order: -1;
    }

    .form-section {
        padding: 35px 25px;
    }

    h1 {
        font-size: 30px;
        text-align: center;
    }

    .login-section {
        flex-direction: column;
        gap: 15px;
    }

    .login-btn {
        width: 100%;
        padding: 14px;
    }

    .forgot-password {
        font-size: 14px;
    }

    .social-login {
        gap: 20px;
    }

    .signup-link {
        font-size: 14px;
    }
}


/* ===============================
   MOBILE VIEW (480px)
   =============================== */
@media (max-width: 480px) {

    .container {
        border-radius: 12px;
    }

    .form-section {
        padding: 25px 20px;
    }

    h1 {
        font-size: 26px;
        margin-bottom: 25px;
        text-align: center;
    }

    input[type="email"],
    input[type="password"] {
        padding: 14px 18px;
        font-size: 14px;
    }

    .login-btn {
        font-size: 16px;
        padding: 14px;
    }

    .divider {
        font-size: 14px;
    }

    .social-login {
        padding: 12px;
        gap: 15px;
    }

    .social-icon {
        width: 36px;
        height: 36px;
    }

    .signup-link {
        font-size: 13px;
    }

    .image-section {
        min-height: 220px;
    }

    .close-btn {
        top: 15px;
        right: 15px;
        font-size: 24px;
    }
}


/* ===============================
   EXTRA SMALL DEVICES
   =============================== */
@media (max-width: 360px) {

    h1 {
        font-size: 22px;
    }

    .login-btn {
        font-size: 14px;
    }

    .social-icon {
        width: 32px;
        height: 32px;
    }

    .signup-link {
        font-size: 12px;
    }
}

    </style>
</head>

</body>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const emailInput = document.querySelector('input[type="email"]');
    const passwordInput = document.querySelector('input[type="password"]');

    emailInput.addEventListener("focus", function () {
        if (emailInput.value === "") {
            emailInput.value = "user@example.com";
        }
    });

    passwordInput.addEventListener("focus", function () {
        if (passwordInput.value === "") {
            passwordInput.value = "Password@123";
        }
    });
});
</script>
