<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Updates Toggle</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

/* Header */
header{
  height:60px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  padding:0 20px;
  border-bottom:1px solid #ddd;
}

header i{
  font-size:22px;
  cursor:pointer;
}

/* Notification Box */
.notification-box{
  width:90%;
  max-width:900px;
  background:#53b44f;
  color:#000;
  padding:30px;
  border-radius:20px;
  margin:30px auto;
  position:relative;
  display:none;
}

.notification-box h3{
  margin-bottom:15px;
}

.notification-box ul{
  margin-left:20px;
}

.notification-box li{
  margin-bottom:10px;
  font-size:16px;
}

/* Close icon */
.close-btn{
  position:absolute;
  top:20px;
  right:25px;
  font-size:22px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <i class="fa-solid fa-bell" onclick="toggleNotification()"></i>
</header>

<div class="notification-box" id="notifyBox">
  <i class="fa-solid fa-xmark close-btn" onclick="toggleNotification()"></i>
  <h3>Order Updates</h3>
  <ul>
    <li>Your order has been placed successfully! We’ll notify you once it’s out for delivery.</li>
    <li>Good news! Your groceries are on the way. Track your delivery in real time.</li>
    <li>Your order has been delivered. Thank you for shopping with us!</li>
  </ul>
</div>

<script>
function toggleNotification(){
  const box = document.getElementById("notifyBox");
  box.style.display = box.style.display === "block" ? "none" : "block";
}
</script>

</body>
</html>
