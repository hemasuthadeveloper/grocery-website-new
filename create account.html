<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
}

body {
    background: #f9f4f1;
}

/* MAIN CONTAINER */
.container {
    display: flex;
    height: 100vh;
}

/* LEFT IMAGES */
.left-images {
    width: 50%;
    display: flex;
    flex-direction: column;
}

.left-images img {
    width: 100%;
    height: 33.33%;
    object-fit: cover;
}

/* RIGHT FORM */
.right-box {
    width: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.form-card {
    width: 420px;
    background: #ffffff;
    border-radius: 20px;
    padding: 40px;
    position: relative;
    transition: 0.4s ease;
}

/* CLOSE BUTTON */
.close-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 22px;
    cursor: pointer;
}

/* TITLE */
.form-card h2 {
    text-align: center;
    margin-bottom: 30px;
}

/* INPUT */
.input-box {
    margin-bottom: 20px;
}

.input-box input {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 2px solid #4caf50;
    font-size: 16px;
}

/* BUTTON */
.btn {
    width: 100%;
    padding: 14px;
    background: #4caf50;
    color: white;
    border: none;
    font-size: 18px;
    border-radius: 10px;
    cursor: pointer;
}

/* FOOTER */
.footer-text {
    text-align: center;
    margin-top: 20px;
}

/* SUCCESS SCREEN */
.success {
    background: #4caf50;
    color: white;
    text-align: center;
    padding: 80px 30px;
}

.success h2 {
    font-size: 30px;
    margin-bottom: 15px;
}

.success p {
    font-size: 18px;
}

/* HIDE */
.hidden {
    display: none;
}
/* ===============================
   LARGE TABLET (1024px)
================================ */
@media (max-width: 1024px) {

    .container {
        flex-direction: row;
    }

    .left-images {
        width: 45%;
    }

    .right-box {
        width: 55%;
    }

    .form-card {
        width: 90%;
        padding: 35px;
    }
}

/* ===============================
   TABLET VIEW (768px)
================================ */
@media (max-width: 768px) {

    .container {
        flex-direction: column;
        height: auto;
    }

    .left-images {
        flex-direction: row;
        width: 100%;
        height: 220px;
    }

    .left-images img {
        height: 100%;
        width: 33.33%;
    }

    .right-box {
        width: 100%;
        padding: 30px 20px;
    }

    .form-card {
        width: 100%;
        padding: 30px;
    }

    .form-card h2 {
        font-size: 26px;
    }
}

/* ===============================
   MOBILE (480px)
================================ */
@media (max-width: 480px) {

    .left-images {
        display: none;
    }

    .container {
        height: auto;
    }

    .right-box {
        width: 100%;
        padding: 20px;
    }

    .form-card {
        padding: 25px 20px;
        border-radius: 16px;
    }

    .form-card h2 {
        font-size: 24px;
    }

    .input-box input {
        padding: 12px;
        font-size: 15px;
    }

    .btn {
        padding: 12px;
        font-size: 16px;
    }

    .footer-text {
        font-size: 14px;
    }

    .close-btn {
        font-size: 20px;
        top: 15px;
        right: 15px;
    }
}

/* ===============================
   SMALL DEVICES (360px)
================================ */
@media (max-width: 360px) {

    .form-card {
        padding: 20px 15px;
    }

    .form-card h2 {
        font-size: 22px;
    }

    .btn {
        font-size: 15px;
    }

    .footer-text {
        font-size: 13px;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- LEFT -->
    <div class="left-images">
        <img src="https://images.unsplash.com/photo-1567306226416-28f0efdc88ce">
        <img src="https://images.unsplash.com/photo-1542838132-92c53300491e">
        <img src="https://images.unsplash.com/photo-1506806732259-39c2d0268443">
    </div>

    <!-- RIGHT -->
    <div class="right-box">

        <!-- FORM CARD -->
        <div class="form-card" id="formBox">

            <div class="close-btn">✕</div>

            <h2>Sign Up</h2>

            <div class="input-box">
               <input type="text" id="name" onclick="autoFillName()">
            </div>

            <div class="input-box">
               <input type="email" id="email" onclick="autoFillEmail()">
            </div>

            <div class="input-box">
              <input type="password" id="password" onclick="autoFillPassword()">
            </div>

            <button class="btn" onclick="signUp()">Sign Up</button>

            <p class="footer-text">
                Already have an account? <a href="login.html">Log in</a>
            </p>
        </div>

        <!-- SUCCESS MESSAGE -->
        <div class="form-card success hidden" id="successBox">
            <h2>✅ Login Successful</h2>
            <p>Welcome! Your account has been created successfully.</p>
        </div>

    </div>

</div>

<script>
function signUp() {
    window.location.href = "main.html";
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    if (name && email && password) {
        document.getElementById("formBox").classList.add("hidden");
        document.getElementById("successBox").classList.remove("hidden");
    } else {
        alert("Please fill all fields");
    }
}
function autoFillName() {
    document.getElementById("name").value = "Amjath Althaf";
}

function autoFillEmail() {
    document.getElementById("email").value = "amjaann@gmail.com";
}

function autoFillPassword() {
    document.getElementById("password").value = "password123";
}

function signUp() {
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    if (name && email && password) {
        document.getElementById("formBox").classList.add("hidden");
        document.getElementById("successBox").classList.remove("hidden");

        setTimeout(() => {
            window.location.href = "main.html";
        }, 2000);
    } else {
        alert("Please fill all fields");
    }
}
</script>

</body>
</html>
